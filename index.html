<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyBook | Perjalanan Hebat Dimulai di Sini</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html"
          ><img class="logo" src="img/skybook.png" alt="skybook"
        /></a>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="#">Flights</a></li>
          <li><a href="#">My Bookings</a></li>
          <li><a href="#">Login</a></li>
          <li><a href="#" class="btn-signup">Sign Up</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="hero">
        <h1>Find Your Next Flight</h1>
        <p>Discover the best flights at the best prices.</p>
        <a href="#flight-search" class="btn-explore">Explore flights</a>
      </section>
      <section id="flight-search" class="flight-search">
        <h2>Find Your Flight</h2>
        <form>
          <div class="form-group">
            <label for="from">From</label>
            <input
              type="text"
              id="from"
              name="from"
              placeholder="Enter departure city"
              required
            />
          </div>
          <div class="form-group">
            <label for="to">To</label>
            <input
              type="text"
              id="to"
              name="to"
              placeholder="Enter destination city"
              required
            />
          </div>
          <div class="form-group">
            <label for="departure-date">Departure Date</label>
            <input
              type="date"
              id="departure-date"
              name="departureDate"
              required
            />
          </div>
          <div class="form-group">
            <label for="passengers">Passengers</label>
            <select name="passengers" id="passengers">
              <option value="1">1 Adult</option>
              <option value="2">2 Adults</option>
              <option value="3">3 Adults</option>
              <option value="4">4 Adults</option>
            </select>
          </div>
          <button type="submit" class="btn-search">Search Flights</button>
        </form>
      </section>
    </main>
  </body>
</html>
